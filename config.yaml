# Jira/Gira Scanner – Konfiguration
# ---------------------------------------------------------------------------
# Diese Datei wird von config.py geladen. Fehlende Werte werden durch
# Defaults ergänzt. Tokens können alternativ über Umgebungsvariablen gesetzt
# werden (siehe unten), damit keine Secrets in Git landen.
#
# Umgebungsvariablen (haben Vorrang):
#   JIRA_URL, JIRA_API_TOKEN, JIRA_PROJECT_KEY,
#   JIRA_SCRIPT_PATH, JIRA_OUTPUT_PATH, JIRA_LOG_LEVEL
# ---------------------------------------------------------------------------

# Jira-Server
server:
  url: "https://your-jira-server.com"   # z. B. https://jira.example.com
  protocol: "https"
  port: 443

# API-Authentifizierung (Bearer-Token für Jira Cloud/Server)
api:
  token: ""                # besser: JIRA_API_TOKEN setzen
  auth_type: "token"       # token
  cors_origins:            # Origins für die FastAPI-API
    - "http://localhost:8000"
    - "http://127.0.0.1:8000"

# Jira-Projekt
project:
  key: "JRA"               # Projektschlüssel; Task-Keys beginnen mit "JRA-"
  name: "Jira Reporting"
  jql: ""                  # optional: eigene JQL (überschreibt project.key)

# Datenablage
storage:
  inventory_path: "inventory"
  inventory_file: "inventory.json"
  suggestions_file: "suggestions.json"
  scan_index: "inventory/scan_index.json"   # Ergebnis von --mode scan
  jira_cache: "jira_data/tasks.json"

# Zu scannende Dateien: ausschließlich SQL
# Erwartete Struktur:
#   <base_path>/<Jahr>/<Abteilung>/<Auftraggeber>/<Jira-Task>/<name>.sql
# Der Jira-Task wird aus dem Elternverzeichnis der SQL-Datei abgeleitet.
scripts:
  base_path: "scripts"
  extensions: [".sql"]
  include_subdirectories: true
  exclude: []

# Task-Filter
filters:
  prefix: "JRA-"           # Key-Prefix (clientseitig geprüft)
  min_priority: "medium"
  statuses: ["open", "in progress", "done"]
  exclude_keywords: []

# Performance / Jira-Requests
performance:
  max_results: 1000        # Obergrenze über alle Seiten
  timeout: 30              # Sekunden pro Request
  retry_attempts: 3

# Jira-Anreicherung (Phase 2, --mode enrich)
# Die Details werden in Blöcken von maximal 100 Keys abgefragt. Zwischen
# den Blöcken wird pausiert, damit der Jira-Server nicht überlastet wird.
jira:
  batch_size: 100             # 1-100 Keys pro Request (wird begrenzt)
  batch_delay_seconds: 1.0    # Pause zwischen zwei Blöcken in Sekunden

# Excel-Export
# Ein Bericht pro Auftrag wird direkt im Task-Verzeichnis abgelegt:
#   <Jahr>/<Abteilung>/<Auftraggeber>/<Jira-Task>/<Jira-Task>.xlsx
# Platzhalter für output_filename:
#   {JIRA}, {SQL}, {YEAR}, {DEPARTMENT}, {CUSTOMER}, {YYYY}, {MM}, {DD}
excel:
  output_path: "output"                       # nur Fallback für leere Berichte
  output_filename: "{JIRA}.xlsx"              # pro Task im Task-Verzeichnis
  fallback_filename: "jira_report_{YYYY}_{MM}_{DD}.xlsx"
  include_headers: true
  include_csv: false                          # optional zusätzlich CSV pro Task
  datetime_format: "%Y-%m-%d %H:%M:%S"
  sheet_name: "Jira-Task-Report"

# Logging
logging:
  level: "INFO"            # DEBUG, INFO, WARNING, ERROR
  output_file: "logs/jira_scanner.log"
  max_size_mb: 10
  backup_count: 3

# Confluence (derzeit nicht implementiert – nur für spätere Erweiterung)
confluence:
  enabled: false
  base_url: "https://your-confluence-server.com"
  api_token: ""
  attachments_path: "jira_data/attachments/"
