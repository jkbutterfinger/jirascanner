<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jira/Gira Scanner Dashboard</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            color: #333;
        }
        
        .container {
            max-width: 1400px;
            margin: 0 auto;
        }
        
        header {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        
        header h1 {
            color: #667eea;
            font-size: 28px;
            margin-bottom: 10px;
        }
        
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .stat-card {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .stat-card h3 {
            color: #666;
            font-size: 14px;
            margin-bottom: 10px;
        }
        
        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #667eea;
        }
        
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        .module-panel {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .module-panel h2 {
            color: #667eea;
            margin-bottom: 15px;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
        }
        
        .module-content {
            max-height: 400px;
            overflow-y: auto;
        }
        
        .table {
            width: 100%;
            border-collapse: collapse;
        }
        
        .table th, .table td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }
        
        .table th {
            background: #f8f9fa;
            color: #333;
            font-weight: 600;
        }
        
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 500;
        }
        
        .status-open {
            background: #ffebee;
            color: #c62828;
        }
        
        .status-in-progress {
            background: #fff3e0;
            color: #ef6c00;
        }
        
        .status-done {
            background: #e8f5e9;
            color: #2e7d32;
        }
        
        .severity-high {
            color: #c62828;
            font-weight: bold;
        }
        
        .severity-medium {
            color: #ef6c00;
        }
        
        .severity-low {
            color: #2e7d32;
        }
        
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px 0;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #5a67d8;
        }
        
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }
        
        .error {
            background: #ffebee;
            color: #c62828;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
        
        .success {
            background: #e8f5e9;
            color: #2e7d32;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 Jira/Gira Scanner Dashboard</h1>
            <p>Requirements Matching & Gap Analysis System</p>
        </header>
        
        <div class="stats-grid">
            <div class="stat-card">
                <h3>📄 总 Scripts 数量</h3>
                <div class="number" id="total-scripts">0</div>
            </div>
            <div class="stat-card">
                <h3>🎯 已匹配任务</h3>
                <div class="number" id="matched-tasks">0</div>
            </div>
            <div class="stat-card">
                <h3>⚠️ 需求缺口 (Gaps)</h3>
                <div class="number" id="missing-reqs">0</div>
            </div>
            <div class="stat-card">
                <h3>📊 匹配成功率</h3>
                <div class="number" id="match-rate">0%</div>
            </div>
        </div>
        
        <div class="dashboard-grid">
            <div class="module-panel">
                <h2>📋 最新任务列表</h2>
                <div class="module-content" id="tasks-list">
                    <div class="loading">加载中...</div>
                </div>
            </div>
            
            <div class="module-panel">
                <h2>📂 Scripts 库存清单</h2>
                <div class="module-content" id="scripts-list">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </div>
        
        <div class="module-panel">
            <h2>🎯 新增 Suggestion</h2>
            <div class="module-content">
                <form id="suggestion-form">
                    <div style="margin-bottom: 10px;">
                        <label style="display: block; margin-bottom: 5px;">Task ID (Jira Key)</label>
                        <input type="text" id="task-id" placeholder="例如：PROJ-345" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;" required>
                    </div>
                    <div style="margin-bottom: 10px;">
                        <label style="display: block; margin-bottom: 5px;">Suggestion 标题</label>
                        <input type="text" id="suggestion-title" placeholder="例如：添加月度报告性能优化" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;" required>
                    </div>
                    <div style="margin-bottom: 10px;">
                        <label style="display: block; margin-bottom: 5px;">严重程度</label>
                        <select id="severity" style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px;">
                            <option value="high">高优先级</option>
                            <option value="medium">中优先级</option>
                            <option value="low">低优先级</option>
                        </select>
                    </div>
                    <div style="margin-bottom: 10px;">
                        <label style="display: block; margin-bottom: 5px;">详细描述</label>
                        <textarea id="suggestion-desc" placeholder="详细描述需求或建议..." style="width: 100%; padding: 8px; border: 1px solid #ddd; border-radius: 4px; height: 80px;" required></textarea>
                    </div>
                    <button type="submit">提交 Suggestion</button>
                </form>
            </div>
        </div>
    </div>
    
    <script>
        // Mock data for demonstration
        let tasksData = [
            { "key": "PROJ-345", "summary": "Monthly Sales Dashboard", "status": "done", "priority": "high", "requirements": ["Calculate regional revenue", "Show conversion rate"] },
            { "key": "PROJ-346", "summary": "Regional Breakdown Feature", "status": "in progress", "priority": "medium", "requirements": ["Break down by region", "Performance under 100ms"] },
            { "key": "PROJ-347", "summary": "API Performance Optimization", "status": "open", "priority": "high", "requirements": ["Reduce API response time", "Implement caching"] }
        ];
        
        let scriptsData = [
            { "path": "/scripts/report_monthly_sales.py", "jira_refs": ["PROJ-345"], "status": "matched" },
            { "path": "/scripts/regional_breakdown.py", "jira_refs": ["PROJ-346"], "status": "partial" }
        ];
        
        document.addEventListener('DOMContentLoaded', function() {
            updateStats();
            renderTasks();
            renderScripts();
            
            document.getElementById('suggestion-form').addEventListener('submit', async function(e) {
                e.preventDefault();
                
                const suggestion = {
                    title: document.getElementById('suggestion-title').value,
                    description: document.getElementById('suggestion-desc').value,
                    task_id: document.getElementById('task-id').value,
                    severity: document.getElementById('severity').value
                };
                
                try {
                    const response = await fetch('/api/suggestions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify(suggestion)
                    });
                    
                    if (response.ok) {
                        alert('Suggestion submitted successfully!');
                        document.getElementById('suggestion-form').reset();
                    } else {
                        alert('Failed to submit suggestion');
                    }
                } catch (error) {
                    alert('Error submitting suggestion: ' + error.message);
                }
            });
        });
        
        function updateStats() {
            document.getElementById('total-scripts').textContent = scriptsData.length;
            document.getElementById('matched-tasks').textContent = tasksData.filter(t => t.status === 'done').length;
            document.getElementById('missing-reqs').textContent = tasksData.filter(t => t.status !== 'done').length;
            const matchRate = tasksData.length > 0 ? Math.round((tasksData.filter(t => t.status === 'done').length / tasksData.length) * 100) : 0;
            document.getElementById('match-rate').textContent = matchRate + '%';
        }
        
        function renderTasks() {
            const container = document.getElementById('tasks-list');
            if (tasksData.length === 0) {
                container.innerHTML = '<div class="loading">暂无数据</div>';
                return;
            }
            
            let html = '<table class="table"><thead><tr><th>Task ID</th><th>Summary</th><th>Status</th><th>Priority</th></tr></thead><tbody>';
            tasksData.forEach(task => {
                const statusClass = task.status === 'open' ? 'status-open' : 
                                   task.status === 'in-progress' ? 'status-in-progress' : 'status-done';
                const severityClass = task.priority === 'high' ? 'severity-high' :
                                     task.priority === 'medium' ? 'severity-medium' : 'severity-low';
                
                html += `<tr>
                    <td>${task.key}</td>
                    <td>${task.summary}</td>
                    <td><span class="status-badge ${statusClass}">${task.status}</span></td>
                    <td><span class="status-badge ${severityClass}">${task.priority.toUpperCase()}</span></td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }
        
        function renderScripts() {
            const container = document.getElementById('scripts-list');
            if (scriptsData.length === 0) {
                container.innerHTML = '<div class="loading">暂无数据</div>';
                return;
            }
            
            let html = '<table class="table"><thead><tr><th>文件路径</th><th>Jira References</th><th>状态</th></tr></thead><tbody>';
            scriptsData.forEach(script => {
                html += `<tr>
                    <td>${script.path}</td>
                    <td>${script.jira_refs.join(', ') || 'None'}</td>
                    <td><span class="status-badge ${script.status}">${script.status}</span></td>
                </tr>`;
            });
            html += '</tbody></table>';
            container.innerHTML = html;
        }
    </script>
</body>
</html>
